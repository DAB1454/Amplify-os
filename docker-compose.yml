services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: amplify
      POSTGRES_PASSWORD: amplify
      POSTGRES_DB: amplify_os
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amplify -d amplify_os"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    volumes:
      - ./apps/worker:/app/apps/worker
      - ./packages:/app/packages

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000

  # ── Local Node profile ──────────────────────────────────────────
  # Start with: docker compose --profile local-node up
  local-node:
    profiles: ["local-node"]
    build:
      context: .
      dockerfile: apps/local_node/Dockerfile
    ports:
      - "8100:8100"
    depends_on:
      api:
        condition: service_started
    environment:
      AMPLIFY_NODE_API_URL: http://api:8000
      AMPLIFY_NODE_TENANT_ID: local
      AMPLIFY_NODE_HEARTBEAT_PORT: "8100"
    volumes:
      - nodedata:/data/.amplify-os
    restart: unless-stopped

volumes:
  pgdata:
  nodedata:
