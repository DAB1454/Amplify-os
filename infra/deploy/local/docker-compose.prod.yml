# Production-like local deployment
# Usage: docker compose -f infra/deploy/local/docker-compose.prod.yml up -d
#
# This mirrors the production topology but runs everything on a single machine.
# No volume mounts (uses built images), restart policies, health checks.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: amplify_os
      POSTGRES_USER: amplify
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-amplify_local}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amplify -d amplify_os"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: ../../..
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: ../../../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://amplify:${POSTGRES_PASSWORD:-amplify_local}@postgres:5432/amplify_os
      REDIS_URL: redis://redis:6379/0
      DEPLOYMENT_MODE: cloud
      ENVIRONMENT: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  worker:
    build:
      context: ../../..
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file: ../../../.env
    environment:
      DATABASE_URL: postgresql+asyncpg://amplify:${POSTGRES_PASSWORD:-amplify_local}@postgres:5432/amplify_os
      REDIS_URL: redis://redis:6379/0
      DEPLOYMENT_MODE: cloud
      ENVIRONMENT: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  web:
    build:
      context: ../../../apps/web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - api

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../../../infra/nginx/amplify.conf:/etc/nginx/conf.d/default.conf:ro
      - certs:/etc/letsencrypt:ro
    depends_on:
      - api
      - web

volumes:
  pgdata:
  redisdata:
  certs:
