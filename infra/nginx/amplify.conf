# Amplify-OS reverse proxy configuration
# Usage: include this in your nginx server block or use as a standalone config.
# For production, replace server_name and add SSL termination (or put behind ALB/CloudFront).

upstream api_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream web_frontend {
    server 127.0.0.1:3000;
    keepalive 16;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=api_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=webhooks:10m rate=20r/s;

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name amplify-os.com *.amplify-os.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.amplify-os.com;

    # SSL (managed by certbot or ALB — paths are placeholders)
    ssl_certificate     /etc/letsencrypt/live/amplify-os.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amplify-os.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Request size limits
    client_max_body_size 50m;

    # Health check (no rate limit, no logging)
    location = /health {
        access_log off;
        proxy_pass http://api_backend;
    }

    # Auth endpoints — strict rate limit
    location /api/v1/auth/ {
        limit_req zone=api_auth burst=10 nodelay;
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Webhook endpoints — moderate rate limit, larger timeout
    location /api/v1/webhooks/ {
        limit_req zone=webhooks burst=30 nodelay;
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket support
    location /api/ws {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # All other API routes
    location /api/ {
        limit_req zone=api_general burst=60 nodelay;
        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    # Block direct access to anything else
    location / {
        return 404;
    }
}

server {
    listen 443 ssl http2;
    server_name amplify-os.com app.amplify-os.com;

    ssl_certificate     /etc/letsencrypt/live/amplify-os.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amplify-os.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    client_max_body_size 10m;

    # Static assets — long cache
    location /_next/static/ {
        proxy_pass http://web_frontend;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Next.js app
    location / {
        proxy_pass http://web_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
