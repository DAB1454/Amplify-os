name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ── Python lint + typecheck ────────────────────────────────────────
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          pip install ruff mypy pydantic pydantic-settings sqlalchemy httpx click cryptography

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy packages/ apps/api/app/ apps/worker/app/ apps/local_node/app/ --ignore-missing-imports

  # ── Python tests ───────────────────────────────────────────────────
  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          pip install pytest pytest-asyncio httpx pydantic pydantic-settings sqlalchemy
          pip install click cryptography starlette uvicorn pillow

      - name: Run package tests
        run: python -m pytest packages/ -v --tb=short

      - name: Run worker tests
        run: python -m pytest apps/worker/tests/ -v --tb=short

      - name: Run local node tests
        run: python -m pytest apps/local_node/tests/ -v --tb=short

  # ── Frontend lint + build ──────────────────────────────────────────
  test-web:
    name: Web Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
      - run: npx eslint src/ --max-warnings 0
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  # ── Docker build (verify images build) ─────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test-python, test-web]
    strategy:
      matrix:
        service: [api, worker, local_node]
        include:
          - service: api
            context: .
            dockerfile: apps/api/Dockerfile
          - service: worker
            context: .
            dockerfile: apps/worker/Dockerfile
          - service: local_node
            context: .
            dockerfile: apps/local_node/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.service }}
        run: |
          docker build \
            -f ${{ matrix.dockerfile }} \
            -t amplify-os/${{ matrix.service }}:ci \
            ${{ matrix.context }}

  # ── Database migrations + integration tests ──────────────────────────
  db-integration:
    name: DB Integration
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: amplify
          POSTGRES_PASSWORD: amplify
          POSTGRES_DB: amplify_os
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amplify"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://amplify:amplify@localhost:5432/amplify_os
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install deps
        run: |
          pip install alembic sqlalchemy[asyncio] asyncpg psycopg2-binary pydantic pydantic-settings
          pip install pytest pytest-asyncio aiosqlite
          pip install -e packages/core -e packages/db

      - name: Run migrations on empty database
        working-directory: apps/api
        run: alembic upgrade head

      - name: Check for migration drift
        working-directory: apps/api
        run: alembic check

      - name: Run seed scripts
        run: |
          python scripts/seed.py
          python scripts/seed_drew.py
          python scripts/seed_artist.py

      - name: Run DB integration tests
        run: python -m pytest tests/test_db_integration.py -v --tb=short

      - name: Verify seed data via SQL queries
        run: |
          python -c "
          import asyncio
          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine
          async def verify():
              engine = create_async_engine('$DATABASE_URL')
              async with engine.connect() as conn:
                  # Verify tenants from all 3 seeds
                  result = await conn.execute(text('SELECT count(*) FROM tenants'))
                  count = result.scalar()
                  assert count >= 3, f'Expected >= 3 tenants, got {count}'
                  # Verify tracks seeded
                  result = await conn.execute(text('SELECT count(*) FROM tracks'))
                  count = result.scalar()
                  assert count >= 30, f'Expected >= 30 tracks, got {count}'
                  # Verify Drew Baird tenant exists
                  result = await conn.execute(text(\"\"\"SELECT name FROM tenants WHERE slug = 'drew-baird'\"\"\"))
                  row = result.fetchone()
                  assert row is not None, 'Drew Baird tenant not found'
                  assert row[0] == 'Drew Baird Music'
                  print(f'OK — {count} tracks, 3+ tenants, Drew Baird verified')
              await engine.dispose()
          asyncio.run(verify())
          "

  # ── Learning schema + evaluation regression guard ───────────────────
  learning-guard:
    name: Learning Schema Guard
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history for diff

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install deps
        run: |
          pip install pytest pytest-asyncio pydantic pydantic-settings sqlalchemy aiosqlite

      - name: Check learning schema changes
        run: |
          # Flag if learning models changed — require review
          CHANGED=$(git diff --name-only origin/main...HEAD -- \
            'packages/db/src/amplify/db/models/learning.py' \
            'packages/learning/src/amplify/learning/schemas/' \
            'packages/learning/src/amplify/learning/feature_extraction/' \
            'packages/learning/src/amplify/learning/rewards/' || true)
          if [ -n "$CHANGED" ]; then
            echo "::warning::Learning schema files changed — verify migration and backward compatibility:"
            echo "$CHANGED"
          fi

      - name: Run learning tests
        run: |
          python -m pytest packages/learning/tests/ -v --tb=short
          python -m pytest apps/api/tests/test_intelligence_dashboard.py -v --tb=short 2>/dev/null || true
          python -m pytest apps/worker/tests/test_intelligence_jobs.py -v --tb=short 2>/dev/null || true

  # ── Deploy staging (on merge to main) ──────────────────────────────
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: [docker-build, db-integration, learning-guard]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr

      - name: Build and push API image
        run: |
          docker build -f apps/api/Dockerfile -t ${{ steps.ecr.outputs.registry }}/amplify-os/api:${{ github.sha }} .
          docker tag ${{ steps.ecr.outputs.registry }}/amplify-os/api:${{ github.sha }} ${{ steps.ecr.outputs.registry }}/amplify-os/api:latest
          docker push ${{ steps.ecr.outputs.registry }}/amplify-os/api:${{ github.sha }}
          docker push ${{ steps.ecr.outputs.registry }}/amplify-os/api:latest

      - name: Build and push Worker image
        run: |
          docker build -f apps/worker/Dockerfile -t ${{ steps.ecr.outputs.registry }}/amplify-os/worker:${{ github.sha }} .
          docker tag ${{ steps.ecr.outputs.registry }}/amplify-os/worker:${{ github.sha }} ${{ steps.ecr.outputs.registry }}/amplify-os/worker:latest
          docker push ${{ steps.ecr.outputs.registry }}/amplify-os/worker:${{ github.sha }}
          docker push ${{ steps.ecr.outputs.registry }}/amplify-os/worker:latest

      - name: Deploy to ECS
        run: |
          aws ecs update-service --cluster amplify-staging --service api --force-new-deployment
          aws ecs update-service --cluster amplify-staging --service worker --force-new-deployment

      - name: Wait for stability
        run: |
          aws ecs wait services-stable --cluster amplify-staging --services api worker
