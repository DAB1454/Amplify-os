[project]
name = "amplify-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.0",
    "pydantic[email]>=2.0",
    "pydantic-settings>=2.0",
    "pyjwt>=2.9",
    "passlib[bcrypt]>=1.7",
    "boto3>=1.35",
    "amplify-core",
    "amplify-db",
    "amplify-learning",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiosqlite>=0.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
