databases:
  - name: amplify-db
    databaseName: amplify_os
    user: amplify
    plan: basic-256mb
    region: oregon

services:
  - type: redis
    name: amplify-redis
    plan: free
    region: oregon
    ipAllowList: []
    maxmemoryPolicy: noeviction

  - type: web
    name: amplify-api
    runtime: docker
    dockerfilePath: apps/api/Dockerfile
    dockerContext: .
    region: oregon
    plan: standard
    healthCheckPath: /health
    preDeployCommand: "alembic upgrade head"
    envVars:
      - key: DEPLOYMENT_MODE
        value: cloud
      - key: DATABASE_URL
        fromDatabase:
          name: amplify-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: amplify-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false
      - key: INSTAGRAM_CLIENT_ID
        sync: false
      - key: INSTAGRAM_CLIENT_SECRET
        sync: false
      - key: INSTAGRAM_REDIRECT_URI
        sync: false
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_REDIRECT_URI
        sync: false
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: TIKTOK_REDIRECT_URI
        sync: false
      - key: TIKTOK_APP_AUDITED
        value: "true"
      - key: TIKTOK_DEFAULT_PRIVACY
        value: "SELF_ONLY"
      - key: TWITTER_CLIENT_ID
        sync: false
      - key: TWITTER_CLIENT_SECRET
        sync: false
      - key: TWITTER_REDIRECT_URI
        sync: false

  - type: worker
    name: amplify-worker
    runtime: docker
    dockerfilePath: apps/worker/Dockerfile
    dockerContext: .
    region: oregon
    plan: standard
    envVars:
      - key: AMPLIFY_DATABASE_URL
        fromDatabase:
          name: amplify-db
          property: connectionString
      - key: AMPLIFY_REDIS_URL
        fromService:
          type: redis
          name: amplify-redis
          property: connectionString
      - key: AMPLIFY_LOG_LEVEL
        value: INFO
      - key: AMPLIFY_DEPLOYMENT_MODE
        value: cloud
      - key: AMPLIFY_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      # Media generation (generate_post_media job): Replicate AI video + the
      # media URL prefix. Set to the SAME values as the API service.
      - key: AMPLIFY_REPLICATE_API_TOKEN
        sync: false
      - key: AMPLIFY_MEDIA_BASE_URL
        sync: false
      - key: AMPLIFY_YOUTUBE_CLIENT_ID
        sync: false
      - key: AMPLIFY_YOUTUBE_CLIENT_SECRET
        sync: false
      - key: AMPLIFY_YOUTUBE_REDIRECT_URI
        sync: false
      - key: AMPLIFY_INSTAGRAM_CLIENT_ID
        sync: false
      - key: AMPLIFY_INSTAGRAM_CLIENT_SECRET
        sync: false
      - key: AMPLIFY_INSTAGRAM_REDIRECT_URI
        sync: false
      - key: AMPLIFY_TIKTOK_CLIENT_KEY
        sync: false
      - key: AMPLIFY_TIKTOK_CLIENT_SECRET
        sync: false
      - key: AMPLIFY_TIKTOK_REDIRECT_URI
        sync: false
      - key: TIKTOK_APP_AUDITED
        value: "true"
      - key: TIKTOK_DEFAULT_PRIVACY
        value: "SELF_ONLY"
      - key: AMPLIFY_TWITTER_CLIENT_ID
        sync: false
      - key: AMPLIFY_TWITTER_CLIENT_SECRET
        sync: false
      - key: AMPLIFY_TWITTER_REDIRECT_URI
        sync: false
      - key: AMPLIFY_S3_BUCKET
        sync: false
      - key: AMPLIFY_S3_REGION
        value: us-east-2
      - key: AMPLIFY_AWS_ACCESS_KEY_ID
        sync: false
      - key: AMPLIFY_AWS_SECRET_ACCESS_KEY
        sync: false
